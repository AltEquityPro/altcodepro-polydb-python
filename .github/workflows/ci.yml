# Phase 1 (launch-roadmap): closes CLAUDE.md's own "Known gaps" item 6 --
# "No CI. No .github/workflows -- no lint, type-check, test, or publish
# automation, and no dependency/secret scanning on a repo that ships
# credential-handling code." Gates the branch this repo's downstream
# consumer (altcodepro-universal-interprter) pins against.
#
# Scoped deliberately: `test` below runs only the emulator-light provider
# suites (postgresql/mongodb/vercel/multi_engine -- Postgres, Mongo and
# Redis containers, no heavyweight cloud emulators) as a real, fast,
# reliable gate. azure/aws/gcp/blockchain need docker-compose.test.yml's
# full emulator stack (Azurite, LocalStack, the gcloud-SDK-based Firestore/
# Pub/Sub emulators, fake-gcs, Ganache, IPFS) -- slower and more failure-
# prone to run on every push; a contributor changing one of those adapters
# still runs `docker compose -f docker-compose.test.yml up -d && pytest -m
# <provider>` locally (see Readme_Integration_Tests.md). Widening this
# workflow to the full emulator stack is real, separate, valuable future
# work, not something to bolt on silently as a "shorter is fine" shortcut.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: black --check src tests
      - run: isort --check-only src tests
      - run: flake8 src
      - name: mypy (report only -- see CLAUDE.md known gap 4, python-version metadata is still inconsistent)
        run: mypy src || true

  security:
    # Blocking, both scans -- a first pass has now been triaged (see the
    # comments below and .gitleaksignore for exactly what was found and
    # why each finding is/isn't real). Previously report-only
    # (`pip-audit ... || true`, no findings ever actually reviewed);
    # gitleaks-action has never had continue-on-error set, so it was
    # already blocking in practice despite the "both report-only" claim
    # this comment used to make -- CLAUDE.md's own Recent changes entry
    # for this pass corrects that.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependency vulnerability scan (pip-audit)
        run: |
          # Upgrade packaging tooling first -- pip/setuptools/wheel are
          # themselves periodically the subject of CVEs (confirmed by
          # actually hitting several during this pass's own triage, all
          # traced to a stale ambient install rather than this repo's own
          # dependencies -- see the paragraph below), and a runner image
          # that hasn't refreshed its default install shouldn't be able
          # to fail this gate on ITS OWN staleness rather than a real
          # finding in this repo's dependency tree.
          pip install --upgrade pip setuptools wheel
          pip install pip-audit
          pip install -e ".[all]"
          # Triaged clean in a fresh, isolated venv (no findings at all --
          # confirmed the ONLY reason an ad hoc local run had ever shown
          # 27 "vulnerabilities" across httplib2/idna/pip/setuptools/
          # urllib3/wheel was stale versions of those packages already
          # sitting in that environment from unrelated earlier work, not
          # anything this repo's own pyproject.toml dependency floors
          # resolve to on a clean install) -- genuinely blocking now, not
          # a placeholder gate that's red from day one.
          pip-audit --skip-editable
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # .gitleaksignore (repo root, auto-detected by the gitleaks CLI
        # this action runs) allowlists the two findings a full-history
        # scan actually turned up, each reviewed and confirmed NOT a real
        # secret: Azurite's own well-known, publicly-documented default
        # emulator storage key (Readme_Integration_Tests.md's own
        # connection-string example is supposed to show this exact
        # string) and a plain entropy false-positive on the source text
        # "mount_point=self.mount_point" in VaultAdapter.py. See that
        # file's own comments for the per-entry reasoning.

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: polydb
          POSTGRES_PASSWORD: polydb
          POSTGRES_DB: polydb_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U polydb -d polydb_test"
          --health-interval 3s --health-timeout 5s --health-retries 10
      mongo:
        image: mongo:7
        ports: ["27018:27017"]
      redis-vercel:
        image: redis:7-alpine
        ports: ["6380:6379"]
      redis-cache:
        image: redis:7-alpine
        ports: ["6381:6379"]
    env:
      POSTGRES_CONNECTION_STRING: postgresql://polydb:polydb@localhost:5433/polydb_test
      MONGODB_URI: mongodb://localhost:27018/polydb_test
      KV_REST_API_URL: redis://localhost:6380
      REDIS_CACHE_URL: redis://localhost:6381
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[all,dev,test]"
      - name: Wait for mongo/redis (no built-in Docker healthcheck on these images)
        run: |
          python - <<'PY'
          import socket, time
          targets = [("localhost", 27018), ("localhost", 6380), ("localhost", 6381)]
          deadline = time.monotonic() + 60
          for host, port in targets:
              while True:
                  try:
                      with socket.create_connection((host, port), timeout=2):
                          break
                  except OSError:
                      if time.monotonic() > deadline:
                          raise SystemExit(f"{host}:{port} never became reachable")
                      time.sleep(1)
          PY
      # multi_engine deliberately excluded: TestSingleEngine's own
      # _patch_factory test helper calls db._meta()/db._model_type(),
      # neither of which exists on DatabaseFactory today (meta extraction
      # is the module-level _extract_meta() function, confirmed by
      # reading databaseFactory.py directly) -- real, pre-existing test
      # drift from an old API shape, reproduced against this exact commit
      # BEFORE this CI workflow was added (byte-for-byte identical
      # failures with and without every change in this same changeset).
      # Tracked as its own known gap rather than silently left out of
      # this workflow's own reasoning; a CI gate that's red on day one
      # from an unrelated bug teaches everyone to ignore it.
      - run: pytest -m "postgresql or mongodb or vercel" --tb=short
